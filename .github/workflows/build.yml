
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Descargar repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # Configurar Java
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Configurar Gradle
      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Extraer ZIP y localizar proyecto
      - name: Extraer y localizar proyecto Android
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -iname '*.zip' \
            -not -path './.git/*' | head -n 1)

          if [ -n "$ZIP" ]; then
            echo "ZIP encontrado: $ZIP"

            mkdir -p /tmp/abstergo
            unzip -q "$ZIP" -d /tmp/abstergo

            PROJECT=$(find /tmp/abstergo \
              -type f \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              | head -n 1)

          else
            echo "No hay ZIP. Buscando proyecto en el repositorio."

            PROJECT=$(find "$GITHUB_WORKSPACE" \
              -type f \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' \
              | head -n 1)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró settings.gradle."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Proyecto encontrado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          ls -la "$PROJECT_DIR"

      # Generar Gradle Wrapper
      - name: Generar Gradle Wrapper
        run: |
          gradle wrapper \
            --gradle-version 8.7 \
            --distribution-type bin

          chmod +x gradlew

          echo "Gradle Wrapper generado correctamente."
          ls -la gradlew gradle/wrapper/
        working-directory: ${{ env.PROJECT_DIR }}

      # Compilar APK
      - name: Compilar APK
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace
        working-directory: ${{ env.PROJECT_DIR }}

      # Guardar APK
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ABSTERGO-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
